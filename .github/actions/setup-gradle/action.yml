name: Setup Gradle
description: Set up Java + Gradle (dependency and build caches) shared across workflows

inputs:
  cache-read-only:
    description: Restore Gradle caches but never write them (use in fan-out consumer jobs)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25

    # Official Gradle action. Its cache is keyed per job (OS + job id + workflow + SHA) and
    # downloaded dependencies are deduplicated across jobs, so a fast job can no longer save an
    # incomplete cache that a later job restores (the previous `actions/cache` key was shared and
    # immutable, which let a producer poison the system-test shards' dependency cache).
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
