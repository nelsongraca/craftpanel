name: Publish Images

on:
  workflow_run:
    workflows: ["System Tests"]
    types: [completed]
    branches: [master]
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Tag release: self-verify on the exact tag commit, then publish.
  # A tag push is the only thing that triggers this workflow; it calls CI + System
  # Tests and depends on both. Reusable-workflow calls do not emit `workflow_run`,
  # so these tag runs cannot re-trigger publish-dev.
  # ---------------------------------------------------------------------------
  ci:
    name: CI (tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  system-tests:
    name: System Tests (tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/system.yml
    secrets: inherit

  publish-release:
    name: Build & Push (tag → version + latest)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [ci, system-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-gradle

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push images (version)
        run: ./gradlew dockerPushAll -PimageVersion=${{ github.ref_name }} -Ppush=true -PdockerCache=true

      - name: Build & push images (latest)
        run: ./gradlew dockerPushAll -PimageVersion=latest -Ppush=true -PdockerCache=true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v ver="${{ github.ref_name }}" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { found = 0 }
            found
          ' CHANGELOG.md > /tmp/release-notes.md
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md

  # ---------------------------------------------------------------------------
  # Master dev image: build the current master head, only once that exact commit's
  # CI + System Tests runs are green.
  # ---------------------------------------------------------------------------
  publish-dev:
    name: Build & Push (master → dev tag)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve master head
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/verify-workflow-success
        with:
          workflow: ci.yml
          sha: ${{ steps.head.outputs.sha }}
          branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/verify-workflow-success
        with:
          workflow: system.yml
          sha: ${{ steps.head.outputs.sha }}
          branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-gradle

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push images (dev)
        run: ./gradlew dockerPushAll -PimageVersion=dev -Ppush=true -PdockerCache=true

  cleanup:
    name: Delete untagged image versions
    needs: [publish-dev, publish-release]
    if: always() && (needs.publish-dev.result == 'success' || needs.publish-release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image: [master, agent, frontend]
    steps:
      - name: Delete untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: craftpanel/${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
