name: System Tests

on:
  push:
    branches:
      - master
      - develop
  workflow_call:

permissions:
  contents: read

concurrency:
  group: system-${{ github.ref }}
  # Newest wins: a superseded run's result is irrelevant. Tag releases no longer depend on a
  # surviving master-branch run — publish.yml calls this workflow directly on the tag commit.
  cancel-in-progress: true

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-gradle

      - name: Build Docker images
        run: ./gradlew :master:buildxBuild :agent:buildxBuild :fake-server:dockerBuildImage -PdockerCache=true

      # Single producer for the shard dependency cache: resolve everything the shards need
      # (including runtime-only deps like testcontainers/antlr4) before they fan out.
      - name: Warm up system-tests test dependencies
        run: ./gradlew :system-tests:compileTestKotlin :system-tests:resolveTestRuntimeClasspath

      - name: Save Docker images
        run: |
          docker save \
            ghcr.io/nelsongraca/craftpanel/master:latest \
            ghcr.io/nelsongraca/craftpanel/agent:latest \
            craftpanel-fake-server:latest \
            craftpanel-fake-proxy:latest \
            -o /tmp/craftpanel-images.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: craftpanel-docker-images
          path: /tmp/craftpanel-images.tar
          retention-days: 1

  system-tests:
    name: System Tests (${{ matrix.tag }})
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tag: [ServerCoreLifecycle, ServerCoreRuntime, ServerOps, ServerMigration, ServerMigrationTarget, Node, Auth, BackupAlerts, Misc]
    steps:
      - uses: actions/checkout@v4

      # Fan-out consumer: restore caches, never write (the shards must not each save a partial
      # Gradle User Home / dependency cache).
      - uses: ./.github/actions/setup-gradle
        with:
          cache-read-only: true

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: craftpanel-docker-images
          path: /tmp

      - name: Load Docker images
        run: docker load -i /tmp/craftpanel-images.tar

      - name: Run system tests
        run: ./gradlew :system-tests:test -PwithCoverage -PskipDockerBuild -PkotestTags=${{ matrix.tag }} --configuration-cache-problems=warn

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: system-test-reports-${{ matrix.tag }}
          path: system-tests/build/reports/tests/test/
          retention-days: 3

      # JUnit XML carries TimingListener's per-spec totals (in <system-err>); keep it around
      # even on success so shard balance can be tuned from real timings.
      - name: Upload JUnit XML
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: system-test-junit-${{ matrix.tag }}
          path: system-tests/build/test-results/test/
          retention-days: 3

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: system-tests/build/test-results/**/*.xml
          flags: system
          report_type: test_results

      - name: Upload raw coverage .ic files
        uses: actions/upload-artifact@v4
        with:
          name: system-tests-coverage-${{ matrix.tag }}
          path: system-tests/build/tmp/kover-coverage/
          retention-days: 1

  merge-coverage:
    name: Merge System Test Coverage
    needs: system-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gradle
        with:
          cache-read-only: true

      - name: Download all shard coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: system-tests-coverage-*
          path: system-tests/build/tmp/kover-coverage
          merge-multiple: true

      - name: Build master/agent jars
        run: ./gradlew :master:jar :agent:jar

      - name: Generate merged coverage report
        run: ./gradlew :system-tests:koverSystemTestReport -PwithCoverage -PskipDockerBuild

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: system-tests/build/reports/kover/system-tests/report.xml
          flags: system
          # Codecov outages (frequent) must not block the build; the tests above are the gate.
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests (MSW) (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gradle

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: frontend/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: ./gradlew :frontend:installFrontend && cd frontend && .node/bin/pnpm exec playwright install chromium

      - name: Install Playwright system dependencies
        run: cd frontend && .node/bin/pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        run: ./gradlew :frontend:testE2eCoverage -Pe2eShard=${{ matrix.shard }}/4 --configuration-cache-problems=warn

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports-${{ matrix.shard }}
          path: frontend/build/reports/playwright/
          retention-days: 3

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/build/reports/junit/playwright.xml
          flags: e2e
          report_type: test_results

      # Shards collect raw coverage only; the merge job below combines and uploads it.
      - name: Upload raw E2E coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-shard-${{ matrix.shard }}
          path: frontend/build/reports/coverage-e2e/.cache/
          include-hidden-files: true
          retention-days: 1

  merge-e2e-coverage:
    name: Merge E2E Coverage
    needs: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gradle
        with:
          cache-read-only: true

      - name: Download shard coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-coverage-shard-*
          path: frontend/build/coverage-shards

      - name: Generate merged coverage report
        run: ./gradlew :frontend:mergeE2eCoverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/build/reports/coverage-e2e/lcov.info
          flags: e2e
          # Codecov outages (frequent) must not block the build; the tests above are the gate.
          fail_ci_if_error: false
