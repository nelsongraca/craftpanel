name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Newest wins: a superseded run's result is irrelevant. Tag releases no longer depend on a
  # surviving master-branch run — publish.yml calls this workflow directly on the tag commit.
  cancel-in-progress: true

jobs:
  # Path gate: a change that cannot affect a suite must not pay for it. Kept as a job (not a
  # workflow-level `paths` filter) so tag releases can still force both suites via publish.yml.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: classify
        name: Classify changed paths
        run: |
          set -euo pipefail

          # PRs compare against the base tip, pushes against the previous tip. A brand-new ref
          # reports an all-zero "before", so fall back to the root commit (i.e. diff everything).
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          backend=false
          frontend=false

          while IFS= read -r path; do
            case "${path}" in
              "" | docs/* | plans/* | graft/* | supertool/* | system-tests/* | *.md | .github/workflows/system.yml | .github/workflows/docs.yml | .github/workflows/publish.yml | .github/workflows/codeql.yml)
                # Not consumed by either suite.
                ;;
              frontend/*)
                frontend=true
                ;;
              master/* | common/* | proto/* | buildSrc/* | gradle/* | gradlew | gradlew.bat | gradle.properties | *.gradle.kts | .github/workflows/ci.yml | .github/actions/*)
                # Backend sources, shared modules, and the Gradle/CI scaffolding.
                # :master:generateOpenApiSpec boots the real routes to emit the spec the frontend
                # client is generated from, so backend surface changes also rebuild that client
                # and re-run its typecheck/tests.
                backend=true
                frontend=true
                ;;
              agent/* | fake-server/*)
                # JVM-only modules the frontend never consumes.
                backend=true
                ;;
            esac
          done <<< "$(git diff --name-only "${base}" "${GITHUB_SHA}")"

          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"

  backend:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      - name: Install pv
        run: sudo apt-get install -y pv

      - name: Run backend unit tests
        run: ./gradlew :master:test :agent:test :common:test -PwithCoverage

      - uses: ./.github/actions/codecov-upload
        with:
          flags: backend
          test-results: master/build/test-results/**/*.xml,agent/build/test-results/**/*.xml,common/build/test-results/**/*.xml
          coverage-files: master/build/reports/kover/report.xml,agent/build/reports/kover/report.xml,common/build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the Prettier ratchet can diff against origin/master.
          fetch-depth: 0

      - uses: ./.github/actions/setup-gradle

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-global-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-global-

      - name: Run frontend lint and typecheck
        run: ./gradlew :frontend:checkFrontend :frontend:typecheckFrontend

      - name: Run frontend tests
        run: ./gradlew :frontend:testFrontend -PwithCoverage

      - uses: ./.github/actions/codecov-upload
        with:
          flags: frontend
          test-results: frontend/build/reports/junit/vitest.xml
          coverage-files: frontend/build/reports/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
